name: Linux sandbox verification

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/linux-sandbox.yml'
      - 'core/**'
      - 'deploy/solver/**'
      - 'tests/test_os_sandbox*.py'
      - 'tests/test_solver_runtime.py'
      - 'scripts/verify_linux_sandbox.sh'

permissions:
  contents: read

jobs:
  sandbox:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r deploy/solver/requirements.txt
          python -m pip install pandas scikit-learn matplotlib flask openpyxl joblib psutil pytest

      - name: Check Docker daemon
        run: docker version && docker info --format '{{json .ServerVersion}}'

      - name: Build worker image and run isolated tests
        env:
          MATHMODEL_SANDBOX_EVIDENCE_DIR: ${{ github.workspace }}/sandbox-evidence
        run: bash scripts/verify_linux_sandbox.sh

      - name: Upload immutable sandbox evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-sandbox-evidence-${{ github.sha }}
          path: sandbox-evidence/
          if-no-files-found: warn
          retention-days: 14
