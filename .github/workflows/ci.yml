name: Full project CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python unit and integration suite
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q core web scripts

      - name: Audit execution entries and module catalog
        run: |
          python scripts/audit_execution_entries.py
          python scripts/audit_module_catalog.py --check-imports

      - name: Run complete Python suite
        run: >-
          python -m pytest -q
          --ignore=tests/test_os_sandbox_integration.py
          --cov=core --cov=web --cov-report=term-missing
          --cov-report=xml:coverage.xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-coverage-${{ github.sha }}
          path: coverage.xml
          if-no-files-found: warn
          retention-days: 14

  javascript:
    name: Browser-side contract tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Run standalone UI tests
        run: |
          node tests/test_graph_lab_ui.js
          node tests/test_model_diagnostics_ui.js

  sandbox:
    name: Linux OS sandbox and process worker
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install sandbox test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r deploy/solver/requirements.txt
          python -m pip install pandas scikit-learn matplotlib flask openpyxl joblib psutil pytest

      - name: Build and verify immutable worker image
        env:
          MATHMODEL_SANDBOX_EVIDENCE_DIR: ${{ github.workspace }}/sandbox-evidence
        run: bash scripts/verify_linux_sandbox.sh

      - name: Upload sandbox evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-ci-sandbox-evidence-${{ github.sha }}
          path: sandbox-evidence/
          if-no-files-found: warn
          retention-days: 14
